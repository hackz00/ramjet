<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" font-family="Segoe UI, Arial, sans-serif" font-size="13" role="img" aria-label="Interaction, startup and memory">
<style>
  .card{fill:#ffffff;stroke:#d5dbe3}
  .t{fill:#14213d;font-size:17px;font-weight:600} .s{fill:#5b6675;font-size:12.5px}
  .l{fill:#1f2933;font-size:13px} .v{fill:#1f2933;font-size:12px}
  .base{fill:#a7b1bd} .cand{fill:#1f5fe0} .good{fill:#0e8a4f;font-size:12px;font-weight:600} .bad{fill:#c2410c;font-size:12px;font-weight:600}
  .axis{stroke:#e3e8ee} .zero{stroke:#7b8794}
  @media (prefers-color-scheme: dark){
    .card{fill:#0f1720;stroke:#2b3745} .t{fill:#f1f5f9} .s{fill:#9fb0c3} .l,.v{fill:#e5ebf2}
    .base{fill:#5c6b7c} .cand{fill:#5b9bff} .good{fill:#4ade80} .bad{fill:#fb923c} .axis{stroke:#243241} .zero{stroke:#9fb0c3}
  }
</style>
<rect class="card" x="0.5" y="0.5" width="759" height="393" rx="6"/>
<text class="t" x="24" y="42">Interaction, startup and memory</text>
<text class="s" x="24" y="62">median change vs upstream Scramjet</text>
<line class="zero" x1="525.6" x2="525.6" y1="72" y2="336"/><text class="l" x="24" y="90">interactive: click latency (INP) (cold)</text>
<rect class="cand" x="524.1" y="79" width="1.5" height="14" rx="3" />
<text class="good" x="518.1" y="90" text-anchor="end">0%</text>
<text class="l" x="24" y="116">interactive: scroll smoothness (p95 frame gap) (cold)</text>
<rect class="cand" x="524.1" y="105" width="1.5" height="14" rx="3" />
<text class="good" x="518.1" y="116" text-anchor="end">0%</text>
<text class="l" x="24" y="142">interactive: controller startup (cold)</text>
<rect class="base" x="525.6" y="131" width="3.3" height="14" rx="3" fill="#c2410c"/>
<text class="bad" x="534.8616098661424" y="142" text-anchor="start">+1%</text>
<text class="l" x="24" y="168">interactive: memory after load (cold)</text>
<rect class="cand" x="484.7" y="157" width="40.9" height="14" rx="3" />
<text class="good" x="478.6744016196591" y="168" text-anchor="end">-15%</text>
<text class="l" x="24" y="194">interactive: memory after clicks + scroll (cold)</text>
<rect class="cand" x="492.3" y="183" width="33.3" height="14" rx="3" />
<text class="good" x="486.3091551706906" y="194" text-anchor="end">-12%</text>
<text class="l" x="24" y="220">interactive: memory kept after leaving the page (cold)</text>
<rect class="cand" x="481.5" y="209" width="44.1" height="14" rx="3" />
<text class="good" x="475.49414134558526" y="220" text-anchor="end">-16%</text>
<text class="l" x="24" y="246">frames: memory kept after leaving the page (cold)</text>
<rect class="cand" x="476.0" y="235" width="49.6" height="14" rx="3" />
<text class="good" x="470.040810667826" y="246" text-anchor="end">-18%</text>
<text class="l" x="24" y="272">spa: memory kept after leaving the page (cold)</text>
<rect class="cand" x="477.8" y="261" width="47.8" height="14" rx="3" />
<text class="good" x="471.75318131718996" y="272" text-anchor="end">-17%</text>
<text class="l" x="24" y="298">frames: CPU time (cold)</text>
<rect class="cand" x="369.6" y="287" width="156.0" height="14" rx="3" />
<text class="good" x="363.6" y="298" text-anchor="end">-56%</text>
<text class="l" x="24" y="324">interactive: CPU time (cold)</text>
<rect class="cand" x="451.8" y="313" width="73.8" height="14" rx="3" />
<text class="good" x="445.77183913220586" y="324" text-anchor="end">-26%</text>

<text class="s" x="24" y="352">Bars left of the line: Ramjet is faster / uses less than upstream Scramjet. Right: it is slower / uses more.</text>
</svg>
